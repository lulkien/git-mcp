[package]
name = "git-mcp-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "yet another git-mcp"
license = "MIT"
keywords = ["git", "mcp", "model context protocol", "server"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
regex = "1"
rmcp = { version = "3.5", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The error contract is documented once in `crate::error`; repeating an
# `# Errors` section on every service function adds noise without information.
missing_errors_doc = { level = "allow", priority = 1 }
# MCP argument structs mirror a wide tool schema on purpose: one flat struct is
# the wire contract, so the bool count is inherent to the schema.
struct_excessive_bools = { level = "allow", priority = 1 }
